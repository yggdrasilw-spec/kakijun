<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>部首ハンター</title>
<style>
  :root{
    --navy:#25406c;
    --navy-dark:#16273f;
    --paper:#f7efd8;
    --paper-line:#d9c69a;
    --accent:#e2793c;
    --accent-dark:#bd5f27;
    --ink:#2c2620;
    --success:#3f8f63;
    --success-dark:#2d6a49;
    --stroke-red:#c0433f;
    --bg:#eef1f2;
    --card-shadow: 0 6px 16px rgba(22,39,63,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:"UD Digital KyokashoN-R","UDデジタル教科書体 N-R","BIZ UDPゴシック","BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:5;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  header .home-btn{
    background:rgba(255,255,255,0.15);
    border:none;
    color:#fff;
    width:34px;height:34px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }
  header .title{
    font-size:16px;
    font-weight:700;
    flex:1;
  }
  header .hud{
    font-size:13px;
    display:flex;
    gap:10px;
  }
  header .hud span{
    background:rgba(255,255,255,0.14);
    padding:4px 10px;
    border-radius:999px;
  }
  main{
    flex:1;
    padding:18px 16px 40px;
    display:flex;
    flex-direction:column;
  }
  h1.hero-title{
    font-size:22px;
    text-align:center;
    color:var(--navy-dark);
    margin:10px 0 4px;
  }
  p.hero-sub{
    text-align:center;
    font-size:13px;
    color:#666;
    margin:0 0 22px;
  }
  .menu-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .menu-card{
    background:#fff;
    border-radius:14px;
    padding:16px;
    box-shadow:var(--card-shadow);
    border-left:6px solid var(--accent);
    cursor:pointer;
  }
  .menu-card:active{ transform:scale(0.98); }
  .menu-card .mtitle{
    font-size:16px;
    font-weight:700;
    color:var(--navy-dark);
    margin-bottom:3px;
  }
  .menu-card .mdesc{
    font-size:12.5px;
    color:#555;
    line-height:1.6;
  }
  .diff-grid{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .diff-btn{
    background:#fff;
    border:2px solid #d7dde3;
    border-radius:12px;
    padding:16px;
    font-size:15px;
    font-weight:700;
    text-align:left;
    cursor:pointer;
  }
  .diff-btn .sub{
    display:block;
    font-size:12px;
    font-weight:400;
    color:#777;
    margin-top:3px;
  }
  .diff-btn:active{ background:#f0f4f7; }
  .back-link{
    background:none;
    border:none;
    color:var(--navy);
    font-size:13px;
    font-weight:700;
    text-align:left;
    padding:4px 0 18px;
    cursor:pointer;
  }

  /* ---- ゲーム画面 ---- */
  .game-hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:13px;
    font-weight:700;
    color:var(--navy-dark);
  }
  .lives{
    font-size:16px;
    letter-spacing:2px;
  }
  .timer-bar-outer{
    width:100%;
    height:10px;
    background:#dfe6ea;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .timer-bar-inner{
    height:100%;
    background:var(--accent);
    border-radius:999px;
    transition:width 0.1s linear, background-color 0.3s;
  }
  .timer-bar-inner.urgent{ background:var(--stroke-red); }
  .game-kanji-card{
    width:220px;
    height:220px;
    margin:0 auto 14px;
    background:#fff;
    border:2px solid var(--success);
    border-radius:14px;
    padding:10px;
    box-shadow:var(--card-shadow);
  }
  .game-kanji-card.flash-correct{ border-color:var(--success); background:#eafaf1; }
  .game-kanji-card.flash-wrong{ border-color:var(--stroke-red); background:#fdeceb; }
  .part-legend{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px 10px;
    margin:0 auto 10px;
    font-size:11px;
    color:#5a6672;
  }
  .part-legend span{ display:inline-flex; align-items:center; gap:4px; }
  .part-legend .part-name{ font-weight:700; }
  .part-legend .part-glyph{ color:#6d6258; }
  .part-legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .prompt{
    text-align:center;
    font-size:15px;
    font-weight:700;
    color:var(--navy-dark);
    margin-bottom:6px;
  }
  .score-row{
    display:flex;
    justify-content:center;
    gap:18px;
    font-size:13px;
    color:#5a6672;
    margin-bottom:6px;
  }
  .combo-badge{
    color:var(--accent-dark);
    font-weight:700;
  }
  .toast{
    text-align:center;
    font-size:16px;
    font-weight:800;
    margin:6px 0 2px;
    height:24px;
  }
  .toast.correct{ color:var(--success-dark); }
  .toast.wrong{ color:var(--stroke-red); }

  /* ---- 結果画面 ---- */
  .result-card{
    background:#fff;
    border-radius:16px;
    padding:24px 18px;
    box-shadow:var(--card-shadow);
    text-align:center;
    margin-bottom:16px;
  }
  .result-card .big-score{
    font-size:44px;
    font-weight:800;
    color:var(--navy-dark);
    margin:6px 0;
  }
  .result-card .result-label{
    font-size:13px;
    color:#777;
  }
  .result-stats{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:14px;
    font-size:13px;
    color:#555;
  }
  .primary-btn{
    display:block;
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:15.5px;
    font-weight:700;
    margin-top:10px;
    cursor:pointer;
  }
  .primary-btn:active{ background:var(--navy-dark); }
  .secondary-btn{
    display:block;
    width:100%;
    background:transparent;
    color:var(--navy);
    border:2px solid var(--navy);
    border-radius:10px;
    padding:12px;
    font-size:14.5px;
    font-weight:700;
    margin-top:10px;
    cursor:pointer;
  }
  .svg-loading{
    font-size:11px;
    color:#9aa4ad;
    text-align:center;
  }
  footer.credit{
    font-size:10.5px;
    color:#9aa4ad;
    text-align:center;
    padding:14px 16px 22px;
  }
  footer.credit a{ color:#9aa4ad; }
</style>
</head>
<body>
<div id="app"><main><p class="svg-loading">読み込み中…</p></main></div>
<script>
/* ============ データ読み込み ============ */
let KANJI_PARTS = {};
let KANJI_POOL = []; // [{code, char, parts, grade}]
let GRADE_KANJI = {};
let KANJI_RADICALS = {};
let KANJI_META = {};
let RADICAL_NAMES = {};
let RADICAL_NAMES_BY_NUMBER = {};

async function boot(){
  try{
    const res = await fetch('data/kanji_parts.json');
    if(!res.ok) throw new Error('fetch failed');
    KANJI_PARTS = await res.json();
    KANJI_RADICALS = await fetch('data/kanji2radical.json').then(r=>{if(!r.ok) throw new Error('radical data fetch failed'); return r.json();});
    KANJI_META = await fetch('data/kanjidic2_school.json').then(r=>{if(!r.ok) throw new Error('kanjidic data fetch failed'); return r.json();});
    // 部首名は漢字辞典側の既存データを共有する（未取得でもゲームは動作）。
    try {
      const radicalData = await fetch('../kanji-jiten/data/kanji_data.json').then(r=>r.ok ? r.json() : []);
      radicalData.forEach(k=>{ if(k.radical && k.radicalName){ RADICAL_NAMES[k.radical] = k.radicalName; RADICAL_NAMES[k.radical.normalize('NFKC')] = k.radicalName; } });
    } catch(e) { /* 部首名がない環境では部品文字を表示 */ }
    KANJI_POOL = Object.entries(KANJI_META).map(([char, meta])=>{
      const code = char.codePointAt(0).toString(16).padStart(5,'0');
      // 事前生成したKanjiVG由来の部品分割をまず使う。
      // SVGは表示用の筆画データとして使い、部品データがない場合だけ補完する。
      const parts = KANJI_PARTS[code] || null;
      return {char, code, grade:meta.grade, strokes:meta.strokes, radicalNumber:meta.radicalNumber, parts};
    });
    GRADE_KANJI = {};
    KANJI_POOL.forEach(kanji=>{
      if(!GRADE_KANJI[kanji.grade]) GRADE_KANJI[kanji.grade] = [];
      GRADE_KANJI[kanji.grade].push([kanji.char, kanji.code]);
    });
    render();
  }catch(err){
    document.getElementById('app').innerHTML =
      '<main><p class="svg-loading">かんじデータを読み込めませんでした。kakijun本体とdata/フォルダを確認してください（file://では動きません）。</p></main>';
  }
}

function radicalDisplayName(part, kanji){
  const glyph = part.element || '部品';
  if(RADICAL_NAMES[glyph]) return RADICAL_NAMES[glyph];
  if(part.radical && kanji.radicalNumber){
    const radicalGlyph = String.fromCodePoint(0x2f00 + kanji.radicalNumber - 1).normalize('NFKC');
    if(RADICAL_NAMES[radicalGlyph]) return RADICAL_NAMES[radicalGlyph];
  }
  return '部品';
}
function partLabel(part, kanji, index){
  const glyph = part.element || `パーツ${index+1}`;
  const name = radicalDisplayName(part, kanji);
  return `<span class="part-name">${name}</span><span class="part-glyph">（${glyph}）</span>`;
}

/* ============ SVG読み込み・解析（漢字辞典アプリと同じ仕組み） ============ */
const svgCache = {};
function parseKanjiSVG(text){
  const cleaned = text.replace(/<!DOCTYPE[^>]*\[[\s\S]*?\]>/, '');
  const normalized = cleaned.replace(/<svg\b(?![^>]*\bxmlns:kvg=)/, '<svg xmlns:kvg="http://kanjivg.tagaini.net"');
  const doc = new DOMParser().parseFromString(normalized, 'image/svg+xml');
  const svgEl = doc.querySelector('svg');
  if(!svgEl) throw new Error('invalid svg');
  const viewBox = svgEl.getAttribute('viewBox') || '0 0 109 109';
  const paths = Array.from(doc.querySelectorAll('path'));
  const strokes = paths.map(p=>({d:p.getAttribute('d')}));
  return {viewBox, strokes, doc, paths};
}
function partsFromSVG(data){
  const root = data.doc.querySelector('g[id^="kvg:"][kvg\\:element]');
  if(!root) return [{element:'全体', start:0, end:data.paths.length-1, radical:true}];
  // element属性のない中間グループ（例: 愛の下半分）をそのまま一部品にせず、
  // 配下の実部品まで展開する。これでネストした「心」なども選択対象になる。
  const parts = [];
  function collect(group){
    const children = Array.from(group.children).filter(el=>el.tagName.toLowerCase()==='g');
    if(group !== root && group.getAttribute('kvg:element')) { parts.push(group); return; }
    children.forEach(collect);
  }
  collect(root);
  return (parts.length ? parts : [root]).map(group=>{
    const groupPaths = Array.from(group.querySelectorAll('path'));
    const indexes = groupPaths.map(p=>data.paths.indexOf(p)).filter(i=>i>=0);
    const radical = Array.from(group.querySelectorAll('*')).some(el=>Array.from(el.attributes||[]).some(a=>a.name.endsWith('radical') && ['general','tradit'].includes(a.value)))
      || Array.from(group.attributes||[]).some(a=>a.name.endsWith('radical') && ['general','tradit'].includes(a.value));
    return {element:group.getAttribute('kvg:element') || '全体', start:Math.min(...indexes), end:Math.max(...indexes), radical};
  }).filter(p=>Number.isFinite(p.start));
}
async function ensurePartsLoaded(kanji){
  if(kanji.parts) return;
  try {
    const data = await fetch(`../svg/${kanji.code}.svg`).then(r=>{if(!r.ok) throw new Error('not found'); return r.text();}).then(parseKanjiSVG);
    kanji.parts = partsFromSVG(data);
    KANJI_PARTS[kanji.code] = kanji.parts;
  } catch(e) {
    kanji.parts = KANJI_PARTS[kanji.code] || [{element:'全体', start:0, end:0, radical:true}];
  }
}
function ensureSVGLoaded(code){
  if(svgCache[code]) return svgCache[code]==='loading' ? null : svgCache[code];
  svgCache[code] = 'loading';
  fetch(`../svg/${code}.svg`)
    .then(r=>{ if(!r.ok) throw new Error('not found'); return r.text(); })
    .then(text=>{ svgCache[code] = parseKanjiSVG(text); render(); })
    .catch(()=>{ svgCache[code] = {error:true, strokes:[], viewBox:'0 0 109 109'}; render(); });
  return null;
}
function estimateBBox(dList){
  let xs=[], ys=[];
  dList.forEach(d=>{
    const nums = (d.match(/-?\d+(\.\d+)?/g) || []).map(Number);
    for(let i=0;i+1<nums.length;i+=2){ xs.push(nums[i]); ys.push(nums[i+1]); }
  });
  if(xs.length===0) return {x:0,y:0,w:109,h:109};
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const pad = 6;
  return {x:minX-pad, y:minY-pad, w:(maxX-minX)+pad*2, h:(maxY-minY)+pad*2};
}

/* ゲーム用：タップ判定つきの部品SVG。answeredIdxが立つとその部品を色分けして固定表示する。 */
function renderGamePartsSVG(code, parts, answeredIdx, answeredCorrect){
  const data = ensureSVGLoaded(code);
  if(!data) return `<div class="svg-loading">読み込み中…</div>`;
  if(data.error) return `<div class="svg-loading">読み込めませんでした</div>`;
  const locked = answeredIdx!==null && answeredIdx!==undefined;
  const colors = ['#ef6c5b','#4285d4','#d08a28','#48a878','#9b63c7','#1aa6a6','#e05b9d','#7d8c3f'];
  const groups = parts.map((p,i)=>{
    const strokes = data.strokes.slice(p.start, p.end+1);
    let strokeColor = colors[i % colors.length];
    if(locked && i===answeredIdx){
      strokeColor = answeredCorrect ? 'var(--success)' : 'var(--stroke-red)';
    }
    const clickAttr = locked ? '' : `onpointerdown="handlePartTap(${i}); event.preventDefault(); event.stopPropagation()" onclick="handlePartTap(${i}); event.stopPropagation()" role="button" tabindex="0"`;
    // 外接矩形ではなく、実際の画線を太くした透明パスをクリック領域にする。
    // 曲線・相対座標を含むSVGでも位置がずれず、部品の形に沿って選択できる。
    const hitPaths = strokes.map(s=>`<path d="${s.d}" fill="none" stroke="transparent" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" pointer-events="stroke"/>`).join('');
    const paths = strokes.map(s=>`<path d="${s.d}" fill="none" stroke="${strokeColor}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
    return `<g ${clickAttr} style="cursor:${locked?'default':'pointer'};filter:url(#part-glow-${i})">${hitPaths}${paths}</g>`;
  }).join('');
  const filters = parts.map((p,i)=>`<filter id="part-glow-${i}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${answeredIdx===null?'1.2':'0.5'}" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`).join('');
  return `<svg viewBox="${data.viewBox}" width="100%" height="100%"><defs>${filters}</defs>${groups}</svg>`;
}

/* ============ ゲーム状態 ============ */
const TIME_PER_Q = 8; // 秒
const TIMEATTACK_QUESTIONS = 10;
const SURVIVAL_LIVES = 3;

let game = null; // 現在進行中のゲーム状態
let timerHandle = null;

function clearGameTimer(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
}

function pickPool(difficulty){
  if(difficulty==='all') return KANJI_POOL.slice();
  return KANJI_POOL.filter(k=>k.grade===Number(difficulty));
}
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

async function startGame(mode, difficulty){
  clearGameTimer();
  const pool = pickPool(difficulty);
  if(pool.length===0){ alert('この難易度の漢字データがまだありません'); return; }
  game = {
    mode, difficulty,
    queue: shuffle(pool),
    queueIdx: 0,
    score: 0,
    combo: 0,
    lives: SURVIVAL_LIVES,
    questionsAnswered: 0,
    totalMs: 0,
    questionStartTime: null,
    timeLeft: TIME_PER_Q,
    answeredIdx: null,
    answeredCorrect: null,
    screen: 'playing'
  };
  await ensurePartsLoaded(game.queue[0]);
  nextQuestion();
}

function currentKanji(){
  if(!game) return null;
  if(game.queueIdx >= game.queue.length){
    game.queue = game.queue.concat(shuffle(pickPool(game.difficulty)));
  }
  return game.queue[game.queueIdx];
}

function nextQuestion(){
  clearGameTimer();
  game.answeredIdx = null;
  game.answeredCorrect = null;
  game.timeLeft = TIME_PER_Q;
  game.questionStartTime = Date.now();
  ensurePartsLoaded(currentKanji()).then(render).catch(()=>render());
  if(game.mode !== 'practice'){
    timerHandle = setInterval(tickTimer, 100);
  }
}

function tickTimer(){
  if(!game) return;
  const elapsed = (Date.now() - game.questionStartTime) / 1000;
  game.timeLeft = Math.max(0, TIME_PER_Q - elapsed);
  if(game.timeLeft <= 0){
    clearGameTimer();
    handleTimeout();
    return;
  }
  render();
}

function handleTimeout(){
  game.answeredIdx = -1;
  game.answeredCorrect = false;
  game.combo = 0;
  game.questionsAnswered++;
  if(game.mode==='survival'){
    game.lives--;
  }
  render();
  setTimeout(()=>advanceOrEnd(), 900);
}

function handlePartTap(i){
  if(!game || game.answeredIdx!==null) return;
  clearGameTimer();
  const kanji = currentKanji();
  const chosen = kanji.parts[i];
  if(!chosen) return;
  const correct = !!chosen.radical;
  game.answeredIdx = i;
  game.answeredCorrect = correct;
  game.questionsAnswered++;
  if(game.mode !== 'practice'){
    const elapsedMs = Date.now() - game.questionStartTime;
    game.totalMs += elapsedMs;
  }
  if(correct){
    game.combo++;
    if(game.mode !== 'practice'){
      const bonus = Math.round(game.timeLeft * 10);
      const comboMult = game.combo>=5 ? 1.5 : game.combo>=2 ? 1.2 : 1;
      game.score += Math.round((100 + bonus) * comboMult);
    }
  } else {
    game.combo = 0;
    if(game.mode==='survival'){ game.lives--; }
  }
  render();
  setTimeout(()=>advanceOrEnd(), 900);
}

function advanceOrEnd(){
  if(!game) return;
  if(game.mode==='survival' && game.lives<=0){
    game.screen = 'result';
    render();
    return;
  }
  if(game.mode==='timeattack' && game.questionsAnswered>=TIMEATTACK_QUESTIONS){
    game.screen = 'result';
    render();
    return;
  }
  game.queueIdx++;
  nextQuestion();
}

function quitPractice(){
  clearGameTimer();
  game.screen = 'result';
  render();
}

function backToMenu(){
  clearGameTimer();
  game = null;
  render();
}

/* ============ 画面 ============ */
let uiScreen = 'home'; // home | difficulty(pending mode) | playing/result はgame.screenで管理
let pendingMode = null;

function goDifficultySelect(mode){
  pendingMode = mode;
  uiScreen = 'difficulty';
  render();
}
function goHomeMenu(){
  uiScreen = 'home';
  pendingMode = null;
  game = null;
  clearGameTimer();
  render();
}
function chooseDifficulty(diff){
  uiScreen = 'playing';
  startGame(pendingMode, diff);
}

function renderHomeMenu(){
  return `
    <h1 class="hero-title">部首ハンター</h1>
    <p class="hero-sub">漢字のパーツをタップして、すばやく部首を当てよう！</p>
    <div class="menu-list">
      <div class="menu-card" onclick="goDifficultySelect('timeattack')">
        <div class="mtitle">⏱ タイムアタック</div>
        <div class="mdesc">10問、できるだけ速く・正確に答えてスコアを競おう</div>
      </div>
      <div class="menu-card" onclick="goDifficultySelect('survival')">
        <div class="mtitle">❤ サバイバル</div>
        <div class="mdesc">ライフは3つ。ミスするまで何問続けられるかな？</div>
      </div>
      <div class="menu-card" onclick="goDifficultySelect('practice')">
        <div class="mtitle">🌱 れんしゅう</div>
        <div class="mdesc">タイマーなし。じっくり考えて部首を探せる</div>
      </div>
    </div>`;
}

function renderDifficultySelect(){
  return `
    <button class="back-link" onpointerdown="event.preventDefault(); goHomeMenu()" onclick="event.preventDefault(); goHomeMenu()">← もどる</button>
    <h1 class="hero-title" style="font-size:18px;">学年をえらぼう</h1>
    <div class="diff-grid">
      ${[1,2,3,4,5,6].map(g=>`<button class="diff-btn" onclick="chooseDifficulty('${g}')">小学${g}年<span class="sub">${GRADE_KANJI[g]?.length || 0}字</span></button>`).join('')}
      <button class="diff-btn" onclick="chooseDifficulty('all')">全学年<span class="sub">小学校で習う漢字すべて</span></button>
    </div>`;
}

function renderPlaying(){
  const kanji = currentKanji();
  const timerPct = game.mode==='practice' ? 100 : Math.max(0,(game.timeLeft/TIME_PER_Q)*100);
  const urgent = timerPct < 30;
  const cardClass = game.answeredIdx===null ? '' : (game.answeredCorrect ? 'flash-correct' : 'flash-wrong');
  const radicalName = game.answeredIdx>=0 && game.answeredCorrect ? `${radicalDisplayName(kanji.parts[game.answeredIdx],kanji)}（${kanji.parts[game.answeredIdx].element || '部品'}）` : '';
  const toast = game.answeredIdx===null ? '' :
    (game.answeredIdx===-1 ? `<div class="toast wrong">じかんぎれ…</div>`
     : game.answeredCorrect ? `<div class="toast correct">せいかい！ 部首は「${radicalName}」</div>`
     : `<div class="toast wrong">ざんねん…</div>`);
  return `
    <div class="game-hud">
      <span>${modeLabel(game.mode)}</span>
      ${game.mode==='survival' ? `<span class="lives">${'❤'.repeat(Math.max(0,game.lives))}${'🖤'.repeat(SURVIVAL_LIVES-Math.max(0,game.lives))}</span>` : ''}
      ${game.mode==='timeattack' ? `<span>${game.questionsAnswered}/${TIMEATTACK_QUESTIONS}問</span>` : ''}
    </div>
    ${game.mode!=='practice' ? `<div class="timer-bar-outer"><div class="timer-bar-inner ${urgent?'urgent':''}" style="width:${timerPct}%"></div></div>` : ''}
    <div class="prompt">どこが部首かな？タップしてえらぼう</div>
    ${game.answeredIdx===null ? `<div class="part-legend">${kanji.parts.map((p,i)=>`<span><i style="background:${['#ef6c5b','#4285d4','#d08a28','#48a878','#9b63c7','#1aa6a6','#e05b9d','#7d8c3f'][i%8]}"></i>${partLabel(p,kanji,i)}</span>`).join('')}</div>` : ''}
    <div class="game-kanji-card ${cardClass}">${renderGamePartsSVG(kanji.code, kanji.parts, game.answeredIdx, game.answeredCorrect)}</div>
    <div class="toast ${game.answeredCorrect?'correct':'wrong'}">${toast}</div>
    ${game.mode!=='practice' ? `<div class="score-row"><span>スコア: ${game.score}</span><span class="combo-badge">${game.combo>=2?`${game.combo}コンボ！`:''}</span></div>` : `<div class="score-row"><span>${game.questionsAnswered}問目</span></div>`}
    ${game.mode==='practice' ? `<button class="secondary-btn" onclick="quitPractice()">やめる</button>` : ''}
  `;
}

function modeLabel(mode){
  return mode==='timeattack' ? 'タイムアタック' : mode==='survival' ? 'サバイバル' : 'れんしゅう';
}

function renderResult(){
  let big, label, stats;
  if(game.mode==='timeattack'){
    big = game.score;
    label = 'スコア';
    const avgSec = (game.totalMs/1000/Math.max(1,game.questionsAnswered)).toFixed(1);
    stats = `<div class="result-stats"><span>合計タイム：${(game.totalMs/1000).toFixed(1)}秒</span><span>平均：${avgSec}秒/問</span></div>`;
  } else if(game.mode==='survival'){
    big = Math.max(0, game.questionsAnswered - 1);
    label = '何問続いたか';
    stats = `<div class="result-stats"><span>スコア：${game.score}</span></div>`;
  } else {
    big = game.questionsAnswered;
    label = '答えた問題数';
    stats = '';
  }
  return `
    <div class="result-card">
      <div class="result-label">${label}</div>
      <div class="big-score">${big}</div>
      ${stats}
    </div>
    <button class="primary-btn" onclick="chooseDifficulty(game.difficulty)">もう一度あそぶ</button>
    <button class="secondary-btn" onclick="goHomeMenu()">モードをえらびなおす</button>`;
}

function render(){
  const app = document.getElementById('app');
  let body, title = '部首ハンター', showHomeBtn = uiScreen!=='home';
  if(uiScreen==='home'){ body = renderHomeMenu(); showHomeBtn=false; }
  else if(uiScreen==='difficulty'){ body = renderDifficultySelect(); title = modeLabel(pendingMode); }
  else if(uiScreen==='playing'){
    if(!game){ body = '<p class="svg-loading">…</p>'; }
    else if(game.screen==='result'){ body = renderResult(); title = modeLabel(game.mode)+'・けっか'; }
    else { body = renderPlaying(); title = modeLabel(game.mode); }
  }
  app.innerHTML = `
    <header>
      ${showHomeBtn ? `<button class="home-btn" onpointerdown="event.preventDefault(); goHomeMenu()" onclick="event.preventDefault(); goHomeMenu()">←</button>` : ''}
      <div class="title">${title}</div>
    </header>
    <main>${body}</main>
    <footer class="credit">筆順データ：KanjiVG（CC BY-SA 3.0） / <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">kanjivg.tagaini.net</a></footer>
  `;
}

boot();
</script>
</body>
</html>
