<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>部首データ確認</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f1e8;color:#302b26;margin:0}main{max-width:900px;margin:auto;padding:20px}.bar,.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0}.bar{position:sticky;top:0;z-index:2}.bar button,.parts button{padding:8px 12px;border:1px solid #c9bca9;border-radius:8px;background:#fff;cursor:pointer}.parts{display:flex;gap:8px;flex-wrap:wrap}.parts button.selected{background:#2f6f68;color:#fff}.head{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.kanji{font-size:110px}.svgbox{width:240px;height:240px}.svgbox svg{width:100%;height:100%}.hint{color:#756b60}</style>
<main><h1>部首データ確認</h1><p class="hint">KANJIDIC2と自動判定が一致しなかった漢字です。正しい部品をクリックしてください。</p><div class="bar"><span id="progress"></span>　<button id="prev">前へ</button> <button id="next">次へ</button> <button id="save">修正データを保存</button></div><section id="app"></section></main>
<script>
let validation,parts,meta,items=[],index=0,overrides={};
const code=c=>c.codePointAt(0).toString(16).padStart(5,'0');
const radical=n=>String.fromCodePoint(0x2f00+n-1).normalize('NFKC');
async function start(){[validation,parts,meta]=await Promise.all(['data/bushu_validation.json','data/kanji_parts.json','data/kanjidic2_school.json'].map(x=>fetch(x).then(r=>r.json())));items=Object.entries(validation.report).filter(([,v])=>v.status==='fallback').map(([char,v])=>({char,...v}));render()}
async function render(){const item=items[index],m=meta[item.char],ps=parts[code(item.char)]||[];document.querySelector('#progress').textContent=`${index+1}/${items.length}　${item.char}`;document.querySelector('#app').innerHTML=`<div class="card"><div class="head"><div class="kanji">${item.char}</div><div>部首番号: <b>${m.radicalNumber}</b><br>部首: <b>${radical(m.radicalNumber)}</b><br>総画数: ${m.strokes}<br><span class="hint">正しい部品を1つ選択</span></div><div class="svgbox" id="svg">読み込み中…</div></div><div class="parts">${ps.map((p,i)=>`<button data-i="${i}" class="${p.radical?'selected':''}"><b>${p.element||'部品'}</b><br><small>${p.start}–${p.end}画</small></button>`).join('')}</div><p>現在の正解: ${ps.filter(p=>p.radical).map(p=>p.element).join('、')||'未設定'}</p></div>`;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;ps.forEach((p,j)=>p.radical=j===i);overrides[item.char]={code:code(item.char),parts:ps};render()});try{const t=await fetch('../svg/'+code(item.char)+'.svg').then(r=>r.text()),x=new DOMParser().parseFromString(t.replace(/<!DOCTYPE[\s\S]*?\]>/,''),'image/svg+xml'),s=x.querySelector('svg');s.removeAttribute('width');s.removeAttribute('height');document.querySelector('#svg').replaceChildren(document.importNode(s,true))}catch(e){document.querySelector('#svg').textContent='SVGなし'}}
prev.onclick=()=>{index=(index+items.length-1)%items.length;render()};next.onclick=()=>{index=(index+1)%items.length;render()};save.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(overrides,null,2)],{type:'application/json'}));a.download='bushu_overrides.json';a.click()};start();
</script>
